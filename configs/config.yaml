# Central configuration. Values marked TBD are decided by experiments (see PLAN.md).
seed: 42

paths:
  raw_train: data/raw/train
  raw_student_test: data/raw/student_test
  raw_eval: data/eval            # evaluator trips, placed on the API laptop only
  processed: data/processed
  models: models
  results: results

geo:
  projection: local_equirectangular   # metres, centred per trip; alt: UTM zone 32N (EPSG:32632)

candidates:
  radius_m: 50          # from candidate sweep (results/logs/candidate_sweep.csv)
  max_k: 12             # distance-rank cutoff: train miss 0.59%, student_test 0.07%, ~7-8 candidates/point

labels:
  method: monotonic_alignment   # DP alignment of GPS points to ordered .route arcs
  max_dist_m: 50.0              # points farther than this from every route arc are left unlabelled
  progress_weight: 0.1          # weight on |route progress - GPS displacement| between consecutive points

model:
  selected: lightgbm    # Phase 4 decision (results/logs/phase4_notes.md)
  params_file: configs/lightgbm_tuned.json   # Phase 5 Optuna best (trial 8)

cv:
  n_splits: 5
  group: trip_id

hmm:
  beta: 5.0             # metres; chosen on student_test (results/logs/phase6_notes.md)
  alpha: 0.5            # emission weight; only alpha*beta matters (best ~2.5)
  route_factor: 3.0     # Dijkstra cut-off = route_factor * d_gps + route_slack_m
  route_slack_m: 200.0
  gap_break_seconds: 60

api:
  host: 0.0.0.0
  port: 8000
